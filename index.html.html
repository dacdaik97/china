
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Master HSK Demo V2</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
<div class="max-w-6xl mx-auto">

<h1 class="text-3xl font-bold mb-4">💪 TUẤN ĐẸP TRAI - HÃY GIỎI NHƯ TUẤN 💪</h1>
<h1 class="text-3xl font-bold mb-4">📚 Chinese Master - HSK + Flashcard + Quiz</h1>

<div class="bg-white p-4 rounded-xl shadow mb-4">
<h2 class="font-bold text-xl mb-2">Thêm từ vựng</h2>

<select id="hsk" class="border p-2 w-full mb-2">
<option>HSK1</option><option>HSK2</option><option>HSK3</option>
<option>HSK4</option><option>HSK5</option><option>HSK6</option>
</select>

<input id="lesson" class="border p-2 w-full mb-2" placeholder="Bài học">
<input id="cn" class="border p-2 w-full mb-2" placeholder="Tiếng Trung">
<input id="py" class="border p-2 w-full mb-2" placeholder="Pinyin">
<input id="vn" class="border p-2 w-full mb-2" placeholder="Nghĩa">

<button onclick="addWord()" class="bg-black text-white px-4 py-2 rounded">Thêm từ</button>
</div>

<div class="bg-white p-6 rounded-xl shadow mb-4 text-center">
<h2 class="font-bold text-xl mb-4">Flashcard</h2>

<select id="flashHSK" onchange="nextCard()" class="border p-2"></select>
<select id="flashLesson" onchange="nextCard()" class="border p-2"></select>

<div id="card" class="text-5xl font-bold my-4"></div>

<div id="answer" class="hidden">
<p id="pyText"></p>
<p id="vnText"></p>
<p id="metaText"></p>
</div>

<button onclick="flipCard()" class="border px-4 py-2 rounded">Lật thẻ</button>
<button onclick="nextCard()" class="border px-4 py-2 rounded">Tiếp theo</button>
</div>

<div class="bg-white p-6 rounded-xl shadow mb-4">
<h2 class="font-bold text-xl mb-4">📝 Trắc nghiệm</h2>

<select id="quizHSK" onchange="updateQuizLessons();newQuiz()" class="border p-2"></select>
<select id="quizLesson" onchange="newQuiz()" class="border p-2"></select>

<div class="mt-3">
Điểm: <span id="quizScore">0</span>/<span id="quizTotal">0</span>
</div>

<div class="w-full bg-slate-200 rounded mt-2">
<div id="progressBar" class="bg-green-500 text-white text-center rounded" style="width:0%">0%</div>
</div>

<div id="question" class="text-2xl my-4"></div>
<div id="options"></div>

<button onclick="checkQuiz()" class="mt-3 border px-4 py-2 rounded">Kiểm tra</button>

<div id="result" class="mt-3 font-bold"></div>
</div>

<div class="bg-white p-6 rounded-xl shadow">
<h2 class="font-bold text-xl mb-4">📂 Danh sách từ vựng</h2>
<div id="tree"></div>
</div>

</div>

<script src="vocab.js"></script>

<script>
let current=null;
let answerVN="";
let correct=0;
let total=0;



function addWord(){
 words.push({
  hsk:hsk.value, lesson:lesson.value,
  cn:cn.value, py:py.value, vn:vn.value
 });
 render();
}

function unique(a){ return [...new Set(a)]; }

function renderSelectors(){
 let hsks=unique(words.map(x=>x.hsk));

 let html='<option value="all">Tất cả HSK</option>'+
 hsks.map(x=>`<option value="${x}">${x}</option>`).join("");

 flashHSK.innerHTML=html;
 quizHSK.innerHTML=html;

 updateFlashLessons();
 updateQuizLessons();
}

function updateFlashLessons(){
 let pool=flashHSK.value==="all"?words:words.filter(x=>x.hsk===flashHSK.value);
 let lessons=unique(pool.map(x=>x.lesson));
 flashLesson.innerHTML='<option value="all">Tất cả bài</option>'+lessons.map(x=>`<option>${x}</option>`).join("");
}

function updateQuizLessons(){
 let pool=quizHSK.value==="all"?words:words.filter(x=>x.hsk===quizHSK.value);
 let lessons=unique(pool.map(x=>x.lesson));
 quizLesson.innerHTML='<option value="all">Tất cả bài</option>'+lessons.map(x=>`<option>${x}</option>`).join("");
}

flashHSK.addEventListener("change",()=>{updateFlashLessons();nextCard();});

function getPool(hskSel,lessonSel){
 let pool=words;

 if(hskSel.value!=="all")
   pool=pool.filter(x=>x.hsk===hskSel.value);

 if(lessonSel.value!=="all")
   pool=pool.filter(x=>x.lesson===lessonSel.value);

 return pool;
}

function nextCard(){
 let pool=getPool(flashHSK,flashLesson);
 if(!pool.length) return;

 current=pool[Math.floor(Math.random()*pool.length)];
 card.innerText=current.cn;
 pyText.innerText=current.py;
 vnText.innerText=current.vn;
 metaText.innerText=current.hsk+" • "+current.lesson;
 answer.classList.add("hidden");
}

function flipCard(){
 answer.classList.toggle("hidden");
}

function newQuiz(){
 let pool=getPool(quizHSK,quizLesson);
 if(pool.length===0) return;

 let q=pool[Math.floor(Math.random()*pool.length)];
 answerVN=q.vn;

 question.innerText=q.cn+" nghĩa là gì?";

 let opts=[q.vn];
 while(opts.length<4 && pool.length>1){
   let x=pool[Math.floor(Math.random()*pool.length)].vn;
   if(!opts.includes(x)) opts.push(x);
 }

 opts.sort(()=>Math.random()-0.5);

 options.innerHTML=opts.map(o=>
 `<label><input type="radio" name="q" value="${o}"> ${o}</label><br>`
 ).join("");
}

function checkQuiz(){
 let s=document.querySelector("input[name=q]:checked");
 if(!s) return;

 total++;

 if(s.value===answerVN){
   correct++;
   result.innerText="✅ Chính xác";
 }else{
   result.innerText="❌ Sai. Đáp án: "+answerVN;
 }

 quizScore.innerText=correct;
 quizTotal.innerText=total;

 let percent=Math.round(correct/total*100);
 progressBar.style.width=percent+"%";
 progressBar.innerText=correct+"/"+total+" ("+percent+"%)";

 newQuiz();
}

function toggle(id){
 document.getElementById(id).classList.toggle("hidden");
}

function renderTree(){
 let hsks=unique(words.map(x=>x.hsk));
 let html='';

 hsks.forEach((hskName,hi)=>{
   let hWords=words.filter(x=>x.hsk===hskName);

   html+=`<div class="mb-2 border rounded">
   <button class="w-full p-3 bg-slate-300 text-left font-bold"
   onclick="toggle('h${hi}')">▶ ${hskName} (${hWords.length} từ)</button>
   <div id="h${hi}" class="hidden p-2">`;

   unique(hWords.map(x=>x.lesson)).forEach((lesson,li)=>{
     let lWords=hWords.filter(x=>x.lesson===lesson);

     html+=`<div class="ml-4 mb-2 border rounded">
     <button class="w-full p-2 bg-slate-200 text-left"
     onclick="toggle('l${hi}_${li}')">▶ ${lesson} (${lWords.length} từ)</button>
     <div id="l${hi}_${li}" class="hidden p-2">`;

     lWords.forEach(w=>{
       html+=`<div>${w.cn} - ${w.py} - ${w.vn}</div>`;
     });

     html+='</div></div>';
   });

   html+='</div></div>';
 });

 tree.innerHTML=html;
}

function render(){
 renderSelectors();
 renderTree();
 nextCard();
 newQuiz();
}

render();
</script>
</body>
</html>
